
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabriklayman! 🎉</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #243b64, #080d1c 75%);
    color: white;
    overflow: hidden;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 480px;
    padding: 45px 30px;
    text-align: center;
    border: 1px solid rgba(255,215,100,0.3);
    border-radius: 28px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(18px);
    box-shadow: 0 20px 70px rgba(0,0,0,0.4);
    animation: appear 1s ease;
    z-index: 2;
}

.trophy {
    font-size: 75px;
    margin-bottom: 20px;
    animation: bounce 2s infinite;
}

h1 {
    font-size: 35px;
    color: #ffd76a;
    margin-bottom: 15px;
}

.subtitle {
    color: #d7e2f5;
    font-size: 17px;
    line-height: 1.7;
}

.line {
    width: 70px;
    height: 3px;
    background: #ffd76a;
    margin: 25px auto;
    border-radius: 10px;
}

.message {
    font-size: 16px;
    line-height: 1.8;
    color: #fff;
}

.badge {
    display: inline-block;
    margin-top: 25px;
    padding: 11px 23px;
    border-radius: 30px;
    background: linear-gradient(135deg,#f9d976,#f39f3d);
    color: #172033;
    font-weight: bold;
}

.footer {
    margin-top: 30px;
    color: #9cabc5;
    font-size: 13px;
}

.confetti {
    position: absolute;
    top: -20px;
    animation: fall linear infinite;
    opacity: 0.8;
}

@keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
}

@keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

@keyframes appear {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="card">
    <div class="trophy">🏆</div>

    <h1>Tabriklayman!</h1>

    <p class="subtitle">
        Sertifikat olganingiz muborak bo‘lsin!
    </p>

    <div class="line"></div>

    <p class="message">
        Bu yutuq — mehnat, sabr va intilishning natijasi.
        Siz bilan faxrlanamiz! 
        Kelajakda bundan-da katta marralarni zabt etishingizni
        va barcha orzularingiz amalga oshishini tilayman.
    </p>

    <div class="badge">✨ Katta yutuqlar sari! ✨</div>

    <div class="footer">
        Siz bunga loyiqsiz! ❤️
    </div>
</div>

<script>
const emojis = ["✨","🎉","⭐","💛","🎊"];

for (let i = 0; i < 35; i++) {
    const item = document.createElement("div");
    item.className = "confetti";
    item.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    item.style.left = Math.random()*100 + "vw";
    item.style.animationDuration = (4+Math.random()*6) + "s";
    item.style.animationDelay = Math.random()*5 + "s";
    item.style.fontSize = (12+Math.random()*15) + "px";
    document.body.appendChild(item);
}
</script>

</body>
</html>
